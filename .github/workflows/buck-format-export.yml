name: Temporary Buck formatter and CI

on:
  push:
    branches:
      - maintenance/buck-ripple-validation-results-2026-11-20

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Generate Android platform files
        run: flutter create . --platforms android --project-name psd
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Format Buck audit files
        run: |
          dart format lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart lib/topologies/buck/buck_waveforms.dart test/buck_java_rounding_regression_test.dart test/buck_schematic_orientation_test.dart test/buck_graph_java_oracle_test.dart test/buck_infinite_lmin_display_test.dart test/buck_screen_narrow_layout_test.dart test/buck_java_runtime_cycle_regression_test.dart test/buck_tiny_inductor_runtime_test.dart test/buck_tiny_inductor_screen_layout_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: psd-ripple-pr-check-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Commit formatter output and remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/buck-format-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- test/buck_tiny_inductor_runtime_test.dart test/buck_tiny_inductor_screen_layout_test.dart .github/workflows/buck-format-export.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(buck): format ripple validation regressions"
          fi
          git push origin HEAD:maintenance/buck-ripple-validation-results-2026-11-20
