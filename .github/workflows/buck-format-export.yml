name: Temporary Buck formatter export

on:
  push:
    branches:
      - maintenance/buck-java-decimalformat-2026-11-14

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Format Buck waveform source
        run: dart format lib/topologies/buck/buck_waveforms.dart
      - name: Export formatted source
        uses: actions/upload-artifact@v4
        with:
          name: buck-waveforms-formatted
          path: lib/topologies/buck/buck_waveforms.dart
