name: Temporary Buck formatter diff export

on:
  push:
    branches:
      - maintenance/buck-java-decimalformat-2026-11-14
  pull_request:
    branches:
      - main

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Format and print diff
        run: |
          dart format lib/topologies/buck/buck_waveforms.dart
          git --no-pager diff --no-ext-diff -- lib/topologies/buck/buck_waveforms.dart
