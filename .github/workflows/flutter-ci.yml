name: Flutter CI

permissions:
  contents: write

on:
  push:
    branches: [maintenance/buck-java-floatingdecimal-2026-11-20]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Generate Android platform files
        run: flutter create . --platforms android --project-name psd
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Dart format (Buck audit files)
        run: dart format lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart lib/topologies/buck/buck_waveforms.dart lib/topologies/buck/buck_java_decimal_format.dart test/buck_java_rounding_regression_test.dart test/buck_schematic_orientation_test.dart test/buck_graph_java_oracle_test.dart test/buck_infinite_lmin_display_test.dart test/buck_screen_narrow_layout_test.dart test/buck_java_runtime_cycle_regression_test.dart test/buck_tiny_inductor_runtime_test.dart test/buck_tiny_inductor_screen_layout_test.dart test/buck_java_decimal_format_test.dart
      - name: Commit Dart formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/topologies/buck/buck_waveforms.dart lib/topologies/buck/buck_java_decimal_format.dart test/buck_java_decimal_format_test.dart
            git commit -m "style(buck): format OpenJDK decimal formatter"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: psd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
