name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Generate Android platform files
        run: flutter create . --platforms android --project-name psd
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Apply and export Buck formatting (temporary)
        run: |
          dart format lib/topologies/buck lib/localization/app_strings.dart test/buck_*.dart
          {
            find lib/topologies/buck -type f -name '*.dart' -print
            printf '%s\n' lib/localization/app_strings.dart
            find test -maxdepth 1 -type f -name 'buck_*.dart' -print
          } | sort -u | while IFS= read -r file; do
            echo "BUCK_FORMAT_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "BUCK_FORMAT_FILE_END:$file"
          done
      - name: Dart format check (Buck audit files)
        run: dart format --output=none --set-exit-if-changed lib/topologies/buck lib/localization/app_strings.dart test/buck_*.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: psd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
