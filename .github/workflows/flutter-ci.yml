name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Generate Android platform files
        run: flutter create . --platforms android --project-name psd
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Dart format check (Buck audit files)
        run: dart format --output=none --set-exit-if-changed lib/topologies/buck lib/localization/app_strings.dart test/buck_*.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: psd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
