name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create . --platforms android --project-name psd
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Format Buck-related Dart files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dart format lib/localization/app_strings.dart lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart lib/topologies/buck/buck_screen.dart test/buck_engine_test.dart test/buck_screen_test.dart
          git add lib/localization/app_strings.dart lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart lib/topologies/buck/buck_screen.dart test/buck_engine_test.dart test/buck_screen_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format Buck Dart files"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib/localization/app_strings.dart lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart lib/topologies/buck/buck_screen.dart test/buck_engine_test.dart test/buck_screen_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: psd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
