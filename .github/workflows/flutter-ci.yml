name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: flutter create . --platforms android --project-name psd
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Dart format (Buck audit files)
        run: dart format lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart test/buck_engine_test.dart test/buck_screen_test.dart
      - name: Upload formatted Buck sources for commit
        uses: actions/upload-artifact@v4
        with:
          name: buck-formatted-source
          path: |
            lib/topologies/buck/buck_engine.dart
            lib/topologies/buck/buck_schematic.dart
            test/buck_engine_test.dart
            test/buck_screen_test.dart
      - name: Dart format check (Buck audit files)
        run: dart format --output=none --set-exit-if-changed lib/topologies/buck/buck_engine.dart lib/topologies/buck/buck_schematic.dart test/buck_engine_test.dart test/buck_screen_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: psd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
